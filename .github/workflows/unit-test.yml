name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Get branch and commit info
        id: git_info
        run: |
          # For PR, use the head ref (source branch)
          BRANCH="${{ github.head_ref }}"
          COMMIT="${{ github.event.pull_request.head.sha }}"

          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "short_commit=${COMMIT:0:7}" >> $GITHUB_OUTPUT

          echo "📝 Branch: ${BRANCH}"
          echo "📝 Commit: ${COMMIT}"

      - name: Submit unit tests to Qizhi cluster
        id: submit_tests
        env:
          QZ_USERNAME: ${{ secrets.QZ_USERNAME }}
          QZ_PASSWORD: ${{ secrets.QZ_PASSWORD }}
          QZ_TOKEN: ${{ secrets.QZ_TOKEN }}
        run: |
          echo "🚀 Submitting unit tests to Qizhi cluster..."
          echo "Branch: ${{ steps.git_info.outputs.branch }}"
          echo "Commit: ${{ steps.git_info.outputs.short_commit }}"

          python .github/scripts/qz_client.py \
            --type tmp \
            --branch "${{ steps.git_info.outputs.branch }}" \
            --commit "${{ steps.git_info.outputs.commit }}" \
            --timeout 3600
        continue-on-error: false

      - name: Report test results
        if: always()
        run: |
          if [ ${{ steps.submit_tests.outcome }} == 'success' ]; then
            echo "✅ Unit tests passed!"
            echo "### ✅ Unit Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: \`${{ steps.git_info.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: \`${{ steps.git_info.outputs.short_commit }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: All unit tests passed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Unit tests failed!"
            echo "### ❌ Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: \`${{ steps.git_info.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: \`${{ steps.git_info.outputs.short_commit }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Unit tests failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Check if the test components are correctly implemented" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify gradient computations are correct" >> $GITHUB_STEP_SUMMARY
            echo "3. Ensure distributed environment is properly initialized" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Add PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.submit_tests.outcome }}';
            const branch = '${{ steps.git_info.outputs.branch }}';
            const commit = '${{ steps.git_info.outputs.short_commit }}';

            const body = outcome === 'success'
              ? `### ✅ Unit Tests Passed\n\n- **Branch**: \`${branch}\`\n- **Commit**: \`${commit}\`\n- **Status**: All unit tests passed successfully\n\nThe PR is ready for review!`
              : `### ❌ Unit Tests Failed\n\n- **Branch**: \`${branch}\`\n- **Commit**: \`${commit}\`\n- **Status**: Unit tests failed\n\nPlease check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
